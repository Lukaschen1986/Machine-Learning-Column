# nano_agent — MCP 客户端配置（自定 YAML 格式）
# 字段对齐 QwenPaw MCPClientConfig，降低学习成本
#
# URL 中支持 ${ENV_VAR} 格式的环境变量引用（运行时由 agent.py 解析）

clients:

  # ── 滴滴出行 MCP ──
  didi-mcp:
    name: didi_mcp
    transport: streamable_http
    url: "https://mcp.didichuxing.com/mcp-servers?key=${DIDI_MCP_KEY}"

