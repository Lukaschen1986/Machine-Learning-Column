### model
model_name_or_path: F:/LLM/Qwen/Qwen3.5-0.8B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
#deepspeed: examples/deepspeed/ds_z3_config.json  # 已关闭，Windows兼容

### dataset
dataset: identity
template: qwen3_nothink
cutoff_len: 2048
max_samples: 100000
preprocessing_num_workers: 1  # 默认16，Windows兼容1
dataloader_num_workers: 0  # 默认4，Windows兼容0

### output
output_dir: saves/Qwen3.5-0.8B-FFT
logging_strategy: epoch
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true
save_only_model: true  # 只保存模型权重 + 配置, 不保存：优化器状态、调度器状态、梯度、训练步数, 适合最终发布推理
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
optim: adamw_torch
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 0.00001
num_train_epochs: 4
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
gradient_checkpointing: false  # 已关闭，Windows兼容
packing: true

### eval
#eval_dataset: identity  # eval_dataset和val_size二选一
val_size: 0.1
per_device_eval_batch_size: 2
eval_strategy: epoch
load_best_model_at_end: true  # 保存最优模型
metric_for_best_model: eval_loss  # 用验证集 loss 选最优
greater_is_better: false       # loss 越小越好
save_total_limit: 1